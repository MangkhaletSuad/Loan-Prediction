services:
  # Docker is used only for MariaDB. Flask reads and writes FILE_STORAGE_DIR
  # directly on the Linux host, never through a container filesystem.
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_NAME:-db}
    ports:
      # Keep MariaDB private to the host; Flask connects via 127.0.0.1.
      - "127.0.0.1:${DB_PORT:-13306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      # Imported only when Docker creates a new mariadb_data volume.
      - ./mariadb.sql:/docker-entrypoint-initdb.d/01-flowvault-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mariadb_data:
